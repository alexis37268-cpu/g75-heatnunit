name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar
        run: |
          base64 -d firma.txt > firma.keystore
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee compilacion.log
          cp app/build/outputs/apk/release/app-release.apk diagnostico-auto.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Diagnóstico Auto
          body: Bajá diagnostico-auto.apk desde el 50 Ultra y abrilo para instalar.
          files: diagnostico-auto.apk
          make_latest: true
      # Si falla, deja el log en un release aparte para poder leerlo
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-error
          name: Log de error
          prerelease: true
          files: compilacion.log
